name: Cross-platform Qt tests

on:
  push:
    branches: [FPGA_Agent]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse Windows launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $null = [scriptblock]::Create(
            (Get-Content -Raw .\scripts\start-windows.ps1)
          )
      - name: Run unit, integration, and offscreen Qt tests
        run: python -m unittest discover -s tests -v
